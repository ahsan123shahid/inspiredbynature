<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GEMINI NANO — Luxury Fragrances</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="GEMINI NANO — Premium luxury fragrances, eau de parfum, and gift sets. Free shipping nationwide." />
    
    <style>
      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 0.6s ease-out;
      }

      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #e5e5e5;
        border-top-color: #8b7d6b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loader-text {
        margin-top: 20px;
        font-family: 'Cormorant Garamond', serif;
        font-size: 14px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #8b7d6b;
      }

      .preloader-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>

  </head>
  <body style="background-color:#ffffff">

    <div id="preloader">
      <div class="loader-spinner"></div>
      <div class="loader-text">Loading</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      window.addEventListener('DOMContentLoaded', function() {
        const preloader = document.getElementById('preloader');
        const startTime = Date.now();
        const minDisplay = 800;
        const maxWait = 5000;

        function hidePreloader() {
          if (preloader && !preloader.classList.contains('preloader-hidden')) {
            preloader.classList.add('preloader-hidden');
            setTimeout(function() { preloader.remove(); }, 600);
          }
        }

        function checkReady() {
          const elapsed = Date.now() - startTime;

          if (elapsed >= maxWait) { hidePreloader(); return; }

          const root = document.getElementById('root');
          if (root && root.children.length > 0 && elapsed >= minDisplay) {
            hidePreloader();
            return;
          }

          setTimeout(checkReady, 100);
        }

        setTimeout(checkReady, 100);
      });
    </script>
  </body>
</html>
