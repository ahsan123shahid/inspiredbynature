# Rollback config — points back to Laravel + Vite containers
# Instant revert: cp rollback.conf /etc/nginx/sites-enabled/inspiredbynature.conf && nginx -s reload

server {
    server_name inspiredbynature.com www.inspiredbynature.com;

    # Laravel backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;  # Laravel PHP-FPM
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite frontend (built assets)
    location / {
        proxy_pass http://127.0.0.1:5173;  # Vite dev server or serve from public/
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/inspiredbynature.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inspiredbynature.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name inspiredbynature.com www.inspiredbynature.com;
    return 301 https://$server_name$request_uri;
}
